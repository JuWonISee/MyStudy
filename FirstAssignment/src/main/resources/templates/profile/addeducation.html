<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Experience</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }

        form {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: auto;
        }

        h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn-group {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-submit {
            background-color: teal;
            color: white;
        }

        .btn-cancel {
            background-color: #6c757d;
            color: white;
        }
    </style>
</head>
<body>

<form id="educationForm">
    <h2>Add Experience</h2>

    <label for="school">School</label>
    <input type="text" id="school" name="school" placeholder="Enter school name" required>

    <label for="degree">Degree</label>
    <input type="text" id="degree" name="degree" placeholder="Enter your degree" required>

    <label for="startDate">Start Date</label>
    <input type="date" id="startDate" name="startDate" required>

    <label for="endDate">End Date</label>
    <input type="date" id="endDate" name="endDate">

    <div class="btn-group">
        <button type="submit" class="btn-submit">제출</button>
        <button type="button" class="btn-cancel" onclick="location.href='/myprofile'">취소</button>
    </div>
</form>

<script>
    $(document).ready(function () {
        $('#educationForm').on('submit', function (e) {
            e.preventDefault();

            const payload = {
                school: $('#school').val(),
                degree: $('#degree').val(),
                startDate: $('#startDate').val(),
                endDate: $('#endDate').val()
            };

            $.ajax({
                url: '/myprofile/edu/add',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(payload),
                success: function () {
                    alert("경력이 성공적으로 추가되었습니다.");
                    location.href = "/myprofile";
                },
                error: function () {
                    alert("경력 추가에 실패했습니다.");
                }
            });
        });

    });
</script>

</body>
</html>
